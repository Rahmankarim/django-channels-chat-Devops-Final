apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
  namespace: django-chat
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_USER: "dbadmin"
  POSTGRES_DB: "channels_chat"
  REDIS_PASSWORD: ""
