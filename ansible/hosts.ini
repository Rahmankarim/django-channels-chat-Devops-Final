# Ansible Inventory File - Static Hosts

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa

# Docker deployment hosts
[docker_hosts]
# Example: Standalone EC2 instances or VMs
# docker-host-1 ansible_host=10.0.1.10
# docker-host-2 ansible_host=10.0.1.11

[docker_hosts:vars]
docker_deploy=true
app_user=django
git_repo_url=https://github.com/yourusername/django-channels-chat.git
git_branch=main

# Kubernetes master nodes
[k8s_masters]
# Example: EKS control plane access or self-managed K8s
# k8s-master-1 ansible_host=10.0.2.10

[k8s_masters:vars]
k8s_deploy=true
k8s_namespace=django-chat

# Kubernetes worker nodes
[k8s_workers]
# k8s-worker-1 ansible_host=10.0.2.20
# k8s-worker-2 ansible_host=10.0.2.21

# Database servers (if self-managed)
[databases]
# db-server ansible_host=10.0.3.10

[databases:vars]
postgres_version=15

# Redis/Cache servers (if self-managed)
[cache]
# redis-server ansible_host=10.0.3.20

# Monitoring servers
[monitoring]
# monitoring-server ansible_host=10.0.4.10

[monitoring:vars]
monitoring_enabled=true

# Load balancers
[loadbalancers]
# lb-1 ansible_host=10.0.5.10

# All application servers
[app_servers:children]
docker_hosts
k8s_workers

# Development environment
[development]
# dev-server ansible_host=192.168.1.100

[development:vars]
env=dev
django_debug=true

# Staging environment
[staging]
# staging-server ansible_host=10.0.10.10

[staging:vars]
env=staging
django_debug=false

# Production environment
[production]
# prod-server-1 ansible_host=10.0.20.10
# prod-server-2 ansible_host=10.0.20.11

[production:vars]
env=prod
django_debug=false
